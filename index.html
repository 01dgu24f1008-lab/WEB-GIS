<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
        
        <script src="https://cdn.tailwindcss.com"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
        
        <link rel="stylesheet" href="./resources/ol.css">
        <link rel="stylesheet" href="resources/fontawesome-all.min.css">
        <link href="resources/photon-geocoder-autocomplete.min.css" rel="stylesheet">
        <link rel="stylesheet" href="./resources/ol-layerswitcher.css">
        <link rel="stylesheet" href="./resources/qgis2web.css">
        
        <style>
            html, body { height: 100%; margin: 0; padding: 0; background-color: #ffffff; overflow: hidden; }
            #map { width: 100%; height: 100%; }
            
            .bg-navbar { background-color: #2d5a27; } 
            .bg-sidebar { background-color: #1e212d; }
            .bg-card { background-color: #111319; }
            .text-accent { color: #4ade80; }

            .ol-control > * {
                background-color: #f8f8f8!important;
                color: #444444!important;
                border-radius: 0px;
            }

            .ol-popup {
                position: absolute;
                background-color: white;
                padding: 15px;
                border-radius: 10px;
                border: 1px solid #cccccc;
                bottom: 12px;
                left: -50px;
                min-width: 200px;
                color: #333;
                box-shadow: 0 1px 4px rgba(0,0,0,0.2);
            }
            .ol-popup:after, .ol-popup:before {
                top: 100%;
                border: solid transparent;
                content: " ";
                height: 0;
                width: 0;
                position: absolute;
                pointer-events: none;
            }
            .ol-popup:after {
                border-top-color: white;
                border-width: 10px;
                left: 48px;
                margin-left: -10px;
            }
            .ol-popup:before {
                border-top-color: #cccccc;
                border-width: 11px;
                left: 48px;
                margin-left: -11px;
            }
            .ol-popup-closer {
                text-decoration: none;
                position: absolute;
                top: 2px;
                right: 8px;
                color: #666;
                font-weight: bold;
            }
            .ol-popup-closer:after { content: "✖"; }
        </style>
        <title>Simply Stay - Land Explorer</title>
    </head>
    <body class="flex flex-col">

        <nav class="h-[60px] bg-navbar flex items-center justify-center shadow-lg z-[2000] shrink-0">
            <div class="flex items-center gap-2">
                <div class="bg-white p-1 rounded">
                    <img src="logo poli.png" alt="Logo" class="h-8 w-auto" onerror="this.src='https://via.placeholder.com/30'">
                </div>
                <h1 class="text-white text-xl font-serif italic tracking-tight uppercase">simply stay</h1>
            </div>
        </nav>

        <div class="flex flex-1 overflow-hidden relative">
            <div id="map" class="flex-1 z-0 relative">
                <div id="popup" class="ol-popup">
                    <a href="#" id="popup-closer" class="ol-popup-closer"></a>
                    <div id="popup-content"></div>
                </div>
            </div>

            <aside class="w-80 bg-sidebar h-full text-white p-5 shadow-2xl z-[1001] overflow-y-auto shrink-0 border-l border-gray-800">
                <div class="flex items-center justify-between mb-6 text-gray-400">
                    <h2 class="text-[11px] font-bold flex items-center gap-2 uppercase tracking-tighter">
                        <i class="fas fa-cog"></i> Tetapan Paparan
                    </h2>
                    <button class="text-xs hover:text-white">«</button>
                </div>

                <div class="flex items-center gap-2 mb-6">
                    <span class="text-lg">🌍</span>
                    <h1 class="text-md font-bold italic">Land Explorer</h1>
                </div>

                <div class="mb-8 p-4 bg-card rounded-md border border-gray-700 space-y-3">
                    <p class="text-[10px] text-gray-400 font-bold uppercase mb-2">Kawalan Layer</p>
                    <div class="flex items-center justify-between">
                        <label for="toggleLot" class="text-sm cursor-pointer">Paparan Lot</label>
                        <input type="checkbox" id="toggleLot" checked onchange="toggleLayer('lot')" class="w-4 h-4 rounded border-gray-600 bg-gray-700 text-green-500">
                    </div>
                    <div class="flex items-center justify-between">
                        <label for="toggleSempadan" class="text-sm cursor-pointer">Tanda Sempadan</label>
                        <input type="checkbox" id="toggleSempadan" checked onchange="toggleLayer('sempadan')" class="w-4 h-4 rounded border-gray-600 bg-gray-700 text-green-500">
                    </div>
                </div>

                <div class="space-y-3 mb-8">
                    <input type="text" id="lotInput" placeholder="Masukkan No Lot" class="w-full bg-card border border-gray-700 rounded-md p-3 text-sm text-white focus:ring-1 focus:ring-green-500 outline-none">
                    <button onclick="searchLot()" class="w-full bg-green-700 hover:bg-green-600 py-2.5 rounded-md text-sm font-bold transition">Cari Lot</button>
                    <button onclick="location.reload()" class="w-full bg-red-600 hover:bg-red-500 py-2.5 rounded-md text-sm font-bold transition">Reset Peta</button>
                    <button onclick="exportToPDF()" class="w-full bg-sky-600 hover:bg-sky-500 py-2.5 rounded-md text-sm font-bold flex items-center justify-center gap-2 text-white">
                        <i class="fas fa-file-pdf"></i> Export Detail + Map (PDF)
                    </button>
                </div>

                <div id="lotInfoCard" class="space-y-4">
                    <div class="bg-card border-l-4 border-green-500 p-4 rounded-r-md">
                        <p class="text-[9px] text-gray-400 font-bold uppercase mb-1">Total Lot</p>
                        <p class="text-accent text-lg font-bold" id="totalLot">67</p>
                    </div>
                    <div class="bg-card border-l-4 border-green-500 p-4 rounded-r-md">
                        <p class="text-[9px] text-gray-400 font-bold uppercase mb-1">No Lot Dipilih</p>
                        <p class="text-accent text-lg font-bold" id="selectedLot">-</p>
                    </div>
                    <div class="bg-card border-l-4 border-green-500 p-4 rounded-r-md">
                        <p class="text-[9px] text-gray-400 font-bold uppercase mb-1">Nama Pemilik</p>
                        <p class="text-accent text-sm font-bold uppercase" id="ownerName">-</p>
                    </div>
                    <div class="bg-card border-l-4 border-green-500 p-4 rounded-r-md">
                        <p class="text-[9px] text-gray-400 font-bold uppercase mb-1">Luas Lot</p>
                        <p class="text-accent text-lg font-bold" id="lotArea">0 m²</p>
                    </div>
                </div>
            </aside>
        </div>

        <script src="resources/qgis2web_expressions.js"></script>
        <script src="./resources/functions.js"></script>
        <script src="./resources/ol.js"></script>
        <script src="./resources/ol-layerswitcher.js"></script>
        <script src="resources/photon-geocoder-autocomplete.min.js"></script>
        <script src="layers/batusempadan_0.js"></script>
        <script src="layers/tandasempadan13clean_1.js"></script>
        <script src="layers/LOTFINAL_2.js"></script>
        <script src="styles/batusempadan_0_style.js"></script>
        <script src="styles/tandasempadan13clean_1_style.js"></script>
        <script src="styles/LOTFINAL_2_style.js"></script>
        <script src="./layers/layers.js" type="text/javascript"></script> 
        <script src="./resources/Autolinker.min.js"></script>
        <script src="./resources/qgis2web.js"></script>

        <script>
    window.onload = function() {
        var container = document.getElementById('popup');
        var content = document.getElementById('popup-content');
        var closer = document.getElementById('popup-closer');

        var overlay = new ol.Overlay({
            element: container,
            autoPan: true,
            autoPanAnimation: { duration: 250 }
        });
        map.addOverlay(overlay);

        closer.onclick = function() {
            overlay.setPosition(undefined);
            closer.blur();
            return false;
        };

        if (typeof map !== 'undefined') {
            var lyr_GoogleSatellite = new ol.layer.Tile({
                title: 'Google Satellite',
                type: 'base',
                visible: true,
                source: new ol.source.XYZ({
                    url: 'https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}'
                })
            });
            map.getLayers().insertAt(0, lyr_GoogleSatellite);
        }

        var highlightStyle = new ol.style.Style({
            fill: new ol.style.Fill({ color: 'rgba(255, 255, 0, 0.6)' }),
            stroke: new ol.style.Stroke({ color: '#ffcc33', width: 3 })
        });

        var selectedFeature = null;

        if (typeof map !== 'undefined') {
            map.on('singleclick', function(evt) {
                var feature = map.forEachFeatureAtPixel(evt.pixel, function(feature, layer) {
                    if (layer === lyr_LOTFINAL_2) return feature;
                });

                if (feature) {
                    if (selectedFeature) { selectedFeature.setStyle(undefined); }
                    feature.setStyle(highlightStyle);
                    selectedFeature = feature;

                    var props = feature.getProperties();
                    var noLot = props['NO_LOT'] || props['lot_no'] || props['fid'] || '-';
                    var owner = props['tsp — pe'] || 'TIADA REKOD';
                    var area = (props['AREA'] || props['area'] || '0') + " m²";

                    document.getElementById('selectedLot').innerText = noLot;
                    document.getElementById('ownerName').innerText = owner;
                    document.getElementById('lotArea').innerText = area;

                    content.innerHTML = `
                        <div style="font-family: sans-serif;">
                            <h3 style="margin:0; color:#2d5a27; font-weight:bold;">Info Lot: ${noLot}</h3>
                            <hr style="margin: 8px 0;">
                            <p style="margin:0; font-size:12px;"><b>Pemilik:</b> ${owner}</p>
                            <p style="margin:0; font-size:12px;"><b>Luas:</b> ${area}</p>
                        </div>
                    `;
                    overlay.setPosition(evt.coordinate);
                }
            });
        }

        window.toggleLayer = function(type) {
            if (type === 'lot') {
                var isVisible = document.getElementById('toggleLot').checked;
                if (typeof lyr_LOTFINAL_2 !== 'undefined') lyr_LOTFINAL_2.setVisible(isVisible);
            } else if (type === 'sempadan') {
                var isVisible = document.getElementById('toggleSempadan').checked;
                if (typeof lyr_batusempadan_0 !== 'undefined') lyr_batusempadan_0.setVisible(isVisible);
                if (typeof lyr_tandasempadan13clean_1 !== 'undefined') lyr_tandasempadan13clean_1.setVisible(isVisible);
            }
        };

        window.searchLot = function() {
            var inputVal = document.getElementById('lotInput').value.trim().toLowerCase();
            if (!inputVal) { alert("Sila masukkan No Lot."); return; }
            if (typeof lyr_LOTFINAL_2 === 'undefined') return;

            var source = lyr_LOTFINAL_2.getSource();
            var features = source.getFeatures();
            var found = false;

            for (var i = 0; i < features.length; i++) {
                var props = features[i].getProperties();
                var lotValue = "";
                for (var key in props) {
                    if (key.toUpperCase().includes("LOT") || key.toLowerCase() === "fid") {
                        if (props[key] && props[key].toString().toLowerCase() === inputVal) {
                            lotValue = props[key];
                            found = true;
                            break;
                        }
                    }
                }

                if (found) {
                    if (selectedFeature) { selectedFeature.setStyle(undefined); }
                    features[i].setStyle(highlightStyle);
                    selectedFeature = features[i];

                    document.getElementById('selectedLot').innerText = lotValue;
                    document.getElementById('ownerName').innerText = props['tsp — pe'] || 'TIADA REKOD';
                    document.getElementById('lotArea').innerText = (props['AREA'] || props['area'] || '0') + " m²";

                    var extent = features[i].getGeometry().getExtent();
                    var center = ol.extent.getCenter(extent);
                    map.getView().fit(extent, { duration: 800, padding: [100, 100, 100, 100], maxZoom: 20 });
                    
                    content.innerHTML = `
                        <div style="font-family: sans-serif;">
                            <h3 style="margin:0; color:#2d5a27; font-weight:bold;">Info Lot: ${lotValue}</h3>
                            <hr style="margin: 8px 0;">
                            <p style="margin:0; font-size:12px;"><b>Pemilik:</b> ${props['tsp — pe'] || 'TIADA REKOD'}</p>
                        </div>
                    `;
                    overlay.setPosition(center);
                    break;
                }
            }
            if (!found) alert("No Lot '" + inputVal + "' tidak dijumpai.");
        };

        // --- FUNGSI EXPORT PDF BARU ---
        window.exportToPDF = async function() {
            const { jsPDF } = window.jspdf;
            const lotNo = document.getElementById('selectedLot').innerText;
            
            if (lotNo === "-") {
                alert("Sila pilih atau cari No Lot terlebih dahulu sebelum export.");
                return;
            }

            const doc = new jsPDF('p', 'mm', 'a4');
            const pageWidth = doc.internal.pageSize.getWidth();

            // 1. Tajuk Laporan
            doc.setFillColor(45, 90, 39); // Warna Hijau Navbar
            doc.rect(0, 0, pageWidth, 20, 'F');
            doc.setTextColor(255, 255, 255);
            doc.setFontSize(16);
            doc.text("LAPORAN MAKLUMAT LOT TANAH", pageWidth / 2, 13, { align: "center" });

            // 2. Maklumat Lot (Dari Sidebar)
            doc.setTextColor(0, 0, 0);
            doc.setFontSize(12);
            doc.setFont("helvetica", "bold");
            doc.text("BUTIRAN PEMILIKAN:", 15, 35);
            
            doc.setFont("helvetica", "normal");
            doc.text(`No. Lot: ${lotNo}`, 15, 45);
            doc.text(`Pemilik: ${document.getElementById('ownerName').innerText}`, 15, 52);
            doc.text(`Keluasan: ${document.getElementById('lotArea').innerText}`, 15, 59);
            doc.text(`Tarikh Cetakan: ${new Date().toLocaleString()}`, 15, 66);

            // 3. Tangkap Gambar Peta
            const mapCanvas = document.querySelector('.ol-viewport canvas');
            if (mapCanvas) {
                doc.setFont("helvetica", "bold");
                doc.text("PETA LOKASI:", 15, 80);
                
                // Convert canvas peta ke imej
                const mapImgData = mapCanvas.toDataURL('image/png');
                // Masukkan imej peta ke PDF (x, y, width, height)
                doc.addImage(mapImgData, 'PNG', 15, 85, pageWidth - 30, 100);
            }

            doc.setFontSize(10);
            doc.setTextColor(150, 150, 150);
            doc.text("Dihasilkan secara automatik oleh Simply Stay - Land Explorer", pageWidth / 2, 280, { align: "center" });

            // Simpan Fail
            doc.save(`Laporan_Lot_${lotNo}.pdf`);
        };

        document.getElementById('lotInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') { window.searchLot(); }
        });
    };
</script>
    </body>
</html>
