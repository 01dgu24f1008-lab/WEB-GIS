<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
        <script src="https://cdn.tailwindcss.com"></script>
        
        <link rel="stylesheet" href="./resources/ol.css">
        <link rel="stylesheet" href="resources/fontawesome-all.min.css">
        <link rel="stylesheet" href="./resources/qgis2web.css">
        
        <style>
            html, body { height: 100%; margin: 0; padding: 0; background-color: #ffffff; overflow: hidden; }
            #map { width: 100%; height: 100%; }
            .bg-navbar { background-color: #2d5a27; } 
            .bg-sidebar { background-color: #1x212d; }
            .bg-card { background-color: #111319; }
            .text-accent { color: #4ade80; }
            .ol-popup { background-color: white; padding: 15px; border-radius: 10px; border: 1px solid #cccccc; bottom: 12px; left: -50px; min-width: 180px; }
        </style>
        <title>SIMPLY STAY - Land Explorer</title>
    </head>
    <body class="flex flex-col">

        <nav class="h-[60px] bg-navbar flex items-center justify-center shadow-lg z-[2000] shrink-0">
            <h1 class="text-white text-xl font-serif italic tracking-tight uppercase">simply stay</h1>
        </nav>

        <div class="flex flex-1 overflow-hidden relative">
            <div id="map" class="flex-1 z-0 relative"></div>

            <aside class="w-80 bg-sidebar h-full text-white p-5 shadow-2xl z-[1001] overflow-y-auto shrink-0 border-l border-gray-800">
                <input type="text" id="lotInput" placeholder="Masukkan No Lot" class="w-full bg-card border border-gray-700 rounded-md p-3 text-sm text-white mb-2">
                <button onclick="searchLot()" class="w-full bg-green-700 hover:bg-green-600 py-2.5 rounded-md text-sm font-bold mb-2">Cari Lot</button>
                <button onclick="location.reload()" class="w-full bg-red-600 hover:bg-red-500 py-2.5 rounded-md text-sm font-bold">Reset Peta</button>
                
                <div class="mt-6 space-y-3">
    <div class="bg-card border-l-4 border-blue-500 p-3 rounded-r-md">
        <p class="text-[9px] text-gray-400 font-bold uppercase">Total Lot</p>
        <p class="text-blue-400 text-lg font-bold" id="totalLotCount">0</p>
    </div>

    <div class="bg-card border-l-4 border-green-500 p-3 rounded-r-md">
        <p class="text-[9px] text-gray-400 font-bold uppercase">No Lot Dipilih</p>
        <p class="text-accent text-lg font-bold" id="selectedLot">-</p>
    </div>

    <div class="bg-card border-l-4 border-yellow-500 p-3 rounded-r-md">
        <p class="text-[9px] text-gray-400 font-bold uppercase">Nama Pemilik</p>
        <p class="text-yellow-400 text-lg font-bold" id="ownerName">-</p>
    </div>

    <div class="bg-card border-l-4 border-purple-500 p-3 rounded-r-md">
        <p class="text-[9px] text-gray-400 font-bold uppercase">Luas Lot</p>
        <p class="text-purple-400 text-lg font-bold" id="lotArea">-</p>
    </div>
</div>

        <script src="./resources/ol.js"></script>
        <script src="layers/LOTFINAL_2.js"></script> 
        <script src="./layers/layers.js"></script>
        <script src="./resources/qgis2web.js"></script>

        <script>
    var highlightStyle = new ol.style.Style({
        fill: new ol.style.Fill({ color: 'rgba(255, 255, 0, 0.6)' }),
        stroke: new ol.style.Stroke({ color: '#ffcc33', width: 3 })
    });

    var selectedFeature = null;

    // Fungsi untuk kira total lot sebaik sahaja peta sedia
    function updateStats() {
        if (typeof lyr_LOTFINAL_2 !== 'undefined') {
            var count = lyr_LOTFINAL_2.getSource().getFeatures().length;
            document.getElementById('totalLotCount').innerText = count;
        }
    }

    // Jalankan updateStats selepas 2 saat (bagi masa layer load)
    setTimeout(updateStats, 2000);

    function searchLot() {
        var val = document.getElementById('lotInput').value.trim();
        if (!val) return;

        if (typeof lyr_LOTFINAL_2 === 'undefined') {
            alert("Ralat: Layer 'lyr_LOTFINAL_2' tidak dijumpai. Sila semak fail layers.js");
            return;
        }

        var source = lyr_LOTFINAL_2.getSource();
        var features = source.getFeatures();
        var found = false;

        features.forEach(function(feature) {
            var props = feature.getProperties();
            
            // Cuba pelbagai kemungkinan nama field (NO_LOT, no_lot, lot, dsb)
            var lotNo = props['NO_LOT'] || props['no_lot'] || props['LOT'] || props['id'];

            if (lotNo && lotNo.toString().toLowerCase() === val.toLowerCase()) {
                found = true;
                if (selectedFeature) selectedFeature.setStyle(null);
                
                feature.setStyle(highlightStyle);
                selectedFeature = feature;

                // Kemaskini UI
                document.getElementById('selectedLot').innerText = lotNo;
                document.getElementById('ownerName').innerText = props['NAMA'] || props['PEMILIK'] || props['Owner'] || "Tiada Data";
                document.getElementById('lotArea').innerText = (props['LUAS'] || props['AREA'] || "0") + " m²";

                var extent = feature.getGeometry().getExtent();
                map.getView().fit(extent, { duration: 1000, padding: [100, 100, 100, 100] });
            }
        });

        if (!found) alert("Lot " + val + " tidak dijumpai dalam sistem.");
    }
</script>
        </script>
    </body>
</html>
