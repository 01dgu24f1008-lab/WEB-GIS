<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
        <script src="https://cdn.tailwindcss.com"></script>
        
        <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
        
        <link rel="stylesheet" href="./resources/ol.css">
        <link rel="stylesheet" href="resources/fontawesome-all.min.css">
        <link rel="stylesheet" href="./resources/ol-layerswitcher.css">
        <link rel="stylesheet" href="./resources/qgis2web.css">
        
        <style>
            html, body { height: 100%; margin: 0; padding: 0; background-color: #ffffff; overflow: hidden; }
            #map { width: 100%; height: 100%; }
            .bg-navbar { background-color: #2d5a27; } 
            .bg-sidebar { background-color: #1e212d; }
            .bg-card { background-color: #111319; }
            .text-accent { color: #4ade80; }
            .ol-popup {
                position: absolute; background-color: white; padding: 15px; border-radius: 10px;
                border: 1px solid #cccccc; bottom: 12px; left: -50px; min-width: 200px;
                box-shadow: 0 1px 4px rgba(0,0,0,0.2);
            }
        </style>
        <title>Simply Stay - Land Explorer</title>
    </head>
    <body class="flex flex-col">

        <nav class="h-[60px] bg-navbar flex items-center justify-center shadow-lg z-[2000] shrink-0">
            <div class="flex items-center gap-2">
                <div class="bg-white p-1 rounded">
                    <img src="logo poli.png" alt="Logo" class="h-8 w-auto" onerror="this.src='https://via.placeholder.com/30'">
                </div>
                <h1 class="text-white text-xl font-serif italic uppercase">simply stay</h1>
            </div>
        </nav>

        <div class="flex flex-1 overflow-hidden relative">
            <div id="map" class="flex-1 z-0 relative">
                <div id="popup" class="ol-popup">
                    <a href="#" id="popup-closer" class="ol-popup-closer"></a>
                    <div id="popup-content"></div>
                </div>
            </div>

            <aside class="w-80 bg-sidebar h-full text-white p-5 shadow-2xl z-[1001] overflow-y-auto border-l border-gray-800">
                <div class="flex items-center gap-2 mb-6">
                    <span class="text-lg">🌍</span>
                    <h1 class="text-md font-bold italic">Land Explorer</h1>
                </div>

                <div class="mb-8 p-4 bg-card rounded-md border border-gray-700 space-y-3">
                    <p class="text-[10px] text-gray-400 font-bold uppercase">Kawalan Layer</p>
                    <div class="flex items-center justify-between">
                        <label class="text-sm">Paparan Lot</label>
                        <input type="checkbox" id="toggleLot" checked onchange="toggleLayer('lot')" class="w-4 h-4">
                    </div>
                    <div class="flex items-center justify-between">
                        <label class="text-sm">Sempadan</label>
                        <input type="checkbox" id="toggleSempadan" checked onchange="toggleLayer('sempadan')" class="w-4 h-4">
                    </div>
                </div>

                <div class="space-y-3 mb-8">
                    <input type="text" id="lotInput" placeholder="Masukkan No Lot" class="w-full bg-card border border-gray-700 rounded-md p-3 text-sm text-white outline-none focus:ring-1 focus:ring-green-500">
                    <button onclick="searchLot()" class="w-full bg-green-700 hover:bg-green-600 py-2.5 rounded-md text-sm font-bold transition">Cari Lot</button>
                    <button onclick="exportToPDF(event)" class="w-full bg-sky-600 hover:bg-sky-500 py-2.5 rounded-md text-sm font-bold flex items-center justify-center gap-2">
                        <i class="fas fa-file-pdf"></i> Export Detail + Map (PDF)
                    </button>
                    <button onclick="location.reload()" class="w-full bg-red-600 py-2.5 rounded-md text-sm font-bold">Reset Peta</button>
                </div>

                <div class="space-y-4">
                    <div class="bg-card border-l-4 border-green-500 p-4 rounded-r-md">
                        <p class="text-[9px] text-gray-400 font-bold uppercase">No Lot Dipilih</p>
                        <p class="text-accent text-lg font-bold" id="selectedLot">-</p>
                    </div>
                    <div class="bg-card border-l-4 border-green-500 p-4 rounded-r-md">
                        <p class="text-[9px] text-gray-400 font-bold uppercase">Nama Pemilik</p>
                        <p class="text-accent text-sm font-bold uppercase" id="ownerName">-</p>
                    </div>
                    <div class="bg-card border-l-4 border-green-500 p-4 rounded-r-md">
                        <p class="text-[9px] text-gray-400 font-bold uppercase">Luas Lot</p>
                        <p class="text-accent text-lg font-bold" id="lotArea">0 m²</p>
                    </div>
                </div>
            </aside>
        </div>

        <script src="resources/qgis2web_expressions.js"></script>
        <script src="./resources/functions.js"></script>
        <script src="./resources/ol.js"></script>
        <script src="./resources/ol-layerswitcher.js"></script>
        <script src="layers/batusempadan_0.js"></script>
        <script src="layers/tandasempadan13clean_1.js"></script>
        <script src="layers/LOTFINAL_2.js"></script>
        <script src="styles/batusempadan_0_style.js"></script>
        <script src="styles/tandasempadan13clean_1_style.js"></script>
        <script src="styles/LOTFINAL_2_style.js"></script>
        <script src="./layers/layers.js"></script> 
        <script src="./resources/qgis2web.js"></script>

        <script>
    window.onload = function() {
        var container = document.getElementById('popup');
        var content = document.getElementById('popup-content');
        var closer = document.getElementById('popup-closer');
        var overlay = new ol.Overlay({ element: container, autoPan: true });
        map.addOverlay(overlay);

        closer.onclick = function() {
            overlay.setPosition(undefined);
            closer.blur();
            return false;
        };

        if (typeof map !== 'undefined') {
            var lyr_GoogleSatellite = new ol.layer.Tile({
                source: new ol.source.XYZ({
                    url: 'https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}',
                    crossOrigin: 'anonymous'
                })
            });
            map.getLayers().insertAt(0, lyr_GoogleSatellite);
        }

        var highlightStyle = new ol.style.Style({
            fill: new ol.style.Fill({ color: 'rgba(255, 255, 0, 0.4)' }),
            stroke: new ol.style.Stroke({ color: '#ffcc33', width: 3 })
        });

        var selectedFeature = null;

        // FUNGSI KLIK PETA UNTUK LOT DAN SEMPADAN
        map.on('singleclick', function(evt) {
            var featureAtPixel = map.forEachFeatureAtPixel(evt.pixel, function(f, l) {
                return {feature: f, layer: l};
            });

            if (featureAtPixel) {
                var f = featureAtPixel.feature;
                var l = featureAtPixel.layer;
                var props = f.getProperties();

                // LOGIK UNTUK LAYER LOT
                if (l === lyr_LOTFINAL_2) {
                    if (selectedFeature) selectedFeature.setStyle(undefined);
                    f.setStyle(highlightStyle);
                    selectedFeature = f;

                    updateSidebar(props);
                    
                    content.innerHTML = `
                        <div class="text-xs">
                            <b class="text-green-700">MAKLUMAT LOT</b><hr class="my-1">
                            <b>No Lot:</b> ${props['NO_LOT'] || '-'}<br>
                            <b>Pemilik:</b> ${props['tsp — pe'] || '-'}<br>
                            <b>Luas:</b> ${props['AREA'] || '0'} m²
                        </div>`;
                    overlay.setPosition(evt.coordinate);
                } 
                // LOGIK UNTUK LAYER SEMPADAN (BATU ATAU TANDA)
                else if (l === lyr_batusempadan_0 || l === lyr_tandasempadan13clean_1) {
                    var coord = evt.coordinate;
                    var lonLat = ol.proj.toLonLat(coord);
                    
                    content.innerHTML = `
                        <div class="text-xs">
                            <b class="text-blue-700">KOORDINAT SEMPADAN</b><hr class="my-1">
                            <b>Lat:</b> ${lonLat[1].toFixed(7)}<br>
                            <b>Lon:</b> ${lonLat[0].toFixed(7)}
                        </div>`;
                    overlay.setPosition(evt.coordinate);
                }
            } else {
                // Sembunyikan popup jika kawasan kosong ditekan
                overlay.setPosition(undefined);
            }
        });

        function updateSidebar(p) {
            document.getElementById('selectedLot').innerText = p['NO_LOT'] || p['lot_no'] || '-';
            document.getElementById('ownerName').innerText = p['tsp — pe'] || 'TIADA REKOD';
            document.getElementById('lotArea').innerText = (p['AREA'] || '0') + " m²";
        }

        window.toggleLayer = function(type) {
            if (type === 'lot') lyr_LOTFINAL_2.setVisible(document.getElementById('toggleLot').checked);
            if (type === 'sempadan') {
                var v = document.getElementById('toggleSempadan').checked;
                lyr_batusempadan_0.setVisible(v);
                lyr_tandasempadan13clean_1.setVisible(v);
            }
        };

        window.searchLot = function() {
            var val = document.getElementById('lotInput').value.trim().toLowerCase();
            var features = lyr_LOTFINAL_2.getSource().getFeatures();
            var found = false;

            for (var f of features) {
                var p = f.getProperties();
                if (String(p['NO_LOT']).toLowerCase() === val) {
                    if (selectedFeature) selectedFeature.setStyle(undefined);
                    f.setStyle(highlightStyle);
                    selectedFeature = f;
                    updateSidebar(p);
                    map.getView().fit(f.getGeometry().getExtent(), { duration: 800, padding: [50, 50, 50, 50] });
                    found = true; break;
                }
            }
            if (!found) alert("No Lot tidak dijumpai.");
        };

        window.exportToPDF = function(event) {
            const lotNo = document.getElementById('selectedLot').innerText;
            if (lotNo === "-") return alert("Pilih lot dahulu.");

            const btn = event.currentTarget;
            const originalText = btn.innerHTML;
            btn.innerHTML = "Sila Tunggu...";
            btn.disabled = true;

            map.once('rendercomplete', function() {
                const mapCanvas = document.createElement('canvas');
                const size = map.getSize();
                mapCanvas.width = size[0];
                mapCanvas.height = size[1];
                const mapContext = mapCanvas.getContext('2d');

                Array.prototype.forEach.call(
                    document.querySelectorAll('.ol-layer canvas'),
                    function (canvas) {
                        if (canvas.width > 0) {
                            const opacity = canvas.parentNode.style.opacity;
                            mapContext.globalAlpha = opacity === '' ? 1 : Number(opacity);
                            const transform = canvas.style.transform;
                            const matrix = transform.match(/^matrix\(([^\(]*)\)$/)?.[1].split(',').map(Number) || [1, 0, 0, 1, 0, 0];
                            mapContext.setTransform(matrix[0], matrix[1], matrix[2], matrix[3], matrix[4], matrix[5]);
                            mapContext.drawImage(canvas, 0, 0);
                        }
                    }
                );

                const { jsPDF } = window.jspdf;
                const doc = new jsPDF('p', 'mm', 'a4');

                doc.setFillColor(45, 90, 39);
                doc.rect(0, 0, 210, 20, 'F');
                doc.setTextColor(255, 255, 255);
                doc.text("LAPORAN TANAH SIMPLY STAY", 105, 13, { align: "center" });

                doc.setTextColor(0, 0, 0);
                doc.setFontSize(12);
                doc.text(`No Lot: ${lotNo}`, 15, 35);
                doc.text(`Pemilik: ${document.getElementById('ownerName').innerText}`, 15, 43);
                doc.text(`Luas: ${document.getElementById('lotArea').innerText}`, 15, 51);
                doc.text(`Tarikh: ${new Date().toLocaleDateString()}`, 15, 59);

                const imgData = mapCanvas.toDataURL('image/png');
                doc.addImage(imgData, 'PNG', 15, 70, 180, 120);

                doc.save(`Laporan_Lot_${lotNo}.pdf`);
                
                btn.innerHTML = originalText;
                btn.disabled = false;
            });

            map.renderSync();
        };
    };
</script>
    </body>
</html>
